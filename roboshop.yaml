- name: create ec2 instances and r53 records
  hosts: local
  connection: local
  vars:
    instances: ["mongodb", "redis", "mysql", "rabbitmq" ]
    action: create
    domain_name: pradeepverse.online
    image_id: ami-0055977a6e828a4f4
  tasks:
  - name: create ec2 instances
    amazon.aws.ec2_instance:
      name: "roboshop-{{item}}"
      ami_id: "{{ image_id }}"
      instance_type: t3.micro
      security_groups:
      - "roboshop-common"
      - "roboshop-{{item}}"
      region: us-east-1

    loop: "{{instances}}"
    when: action == "create"