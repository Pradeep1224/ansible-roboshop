- name: creating user service setting nodejs 
  hosts: user
  become: yes
  tasks: 
  - name: disable nodejs module
    command: dnf module disable nodejs -y
  - name: enable nodejs:24 
    command: dnf module enable nodejs:24 -y
  - name: install nodejs
    dnf:
      name: nodejs
      state: present

  - name: creating system user and make /app as home directory ----roboshop
    user:
      name: roboshop 
      create_home: false
      home: /app
      shell: /sbin/nologin
      comment: "roboshop system user"
  - name: remove directory existing
    file:
      path: /app
      state: absent

  - name: remove user.zip
    file:
      path: /tmp/user.zip
      state: absent
  - name: create app directory
    file: 
      path: /app
      state: directory
  - name: downloading file
    get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/user-v4.zip
      dest: /tmp/user.zip
  - name: unzip
    unarchieve: 
      src: /tmp/user.zip
      dest: /app
      remote_src: yes
  - name: install dependencies
    community.general.npm:
      path: /app
  - name: creating service and coping
    template:
      src: user.service.j2
      dest: /etc/systemd/system/user.service
  - name: copy mongo repo
  

  - name: daemon reload
    systemd_service:
      daemon_reload: true
  - name: start and enable user
    service:
      name: user
      state: restarted
      enbable: yes
