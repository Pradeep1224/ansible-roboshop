- name: creating catalogue service setting nodejs 
  hosts: catalogue
  become: yes
  tasks: 
  - name: disable nodejs module
    command: dnf module disable nodejs -y
  - name: enable nodejs:24 
    command: dnf module enable nodejs:24 -y
  - name: install nodejs
    dnf:
      name: nodejs
      state: present

  - name: creating system user and make /app as home directory ----roboshop
    user:
      name: roboshop 
      create_home: false
      home: /app
      shell: /sbin/nologin
      comment: "roboshop system user"
  - name: remove directory existing
    file:
      path: /app
      state: absent

  - name: remove catalogue.zip
    file:
      path: /tmp/catalogue.zip
      state: absent
  - name: create app directory
    file: 
      path: /app
      state: directory
  - name: downloading file
    get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
      dest: /tmp/catalogue.zip
  - name: unzip
    unarchive: 
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes
  - name: install dependencies
    community.general.npm:
      path: /app
  - name: creating service and coping
    template:
      src: catalogue.service.j2
      dest: /etc/systemd/system/catalogue.service
  - name: copy mongo repo
    copy: 
      src: mongo.repo 
      dest: /etc/yum.repos.d/mongo.repo
  - name: install mongodb client
    dnf: 
      name: mongodb-mongosh
      state: present
  - name: check products loaded or not
    command: mongosh --host "{{mongodb_host}}" --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'
    register: product_count
  - name: print product_count
    debug: 
      msg: "{{product_count}}"
  - name: load the products
    shell: mongosh --host "{{mongodb_host}}" </app/db/master-data.js
    when: product_count.stdout | int == 0

  - name: daemon reload
    systemd_service:
      daemon_reload: true
  - name: start and enable catalogue
    service:
      name: catalogue
      state: restarted
      enabled: yes
