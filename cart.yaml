- name: creating cart service setting nodejs 
  hosts: cart
  become: yes
  tasks: 
  - name: disable nodejs module
    command: dnf module disable nodejs -y
  - name: enable nodejs:24 
    command: dnf module enable nodejs:24 -y
  - name: install nodejs
    dnf:
      name: nodejs
      state: present

  - name: creating system user and make /app as home directory ----roboshop
    user:
      name: roboshop 
      create_home: false
      home: /app
      shell: /sbin/nologin
      comment: "roboshop system user"
  - name: remove directory existing
    file:
      path: /app
      state: absent

  - name: remove cart.zip
    file:
      path: /tmp/cart.zip
      state: absent
  - name: create app directory
    file: 
      path: /app
      state: directory
  - name: downloading file
    get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/cart-"{{app_version}}".zip
      dest: /tmp/cart.zip
  - name: unzip
    unarchive: 
      src: /tmp/cart.zip
      dest: /app
      remote_src: yes
  - name: install dependencies
    community.general.npm:
      path: /app
  - name: creating service and coping
    template:
      src: cart.service.j2
      dest: /etc/systemd/system/cart.service
 
  - name: daemon reload
    systemd_service:
      daemon_reload: true
  - name: start and enable cart
    service:
      name: cart
      state: restarted
      enabled: yes
